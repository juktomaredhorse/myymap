<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 결혼 상대 결정하기💍</title>

    <!-- 카카오맵 SDK와 장소 검색 기능 불러오기 -->
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=f38811e47209589c76ef3002c7c95204&libraries=services&autoload=false"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Malgun Gothic", sans-serif;
            color: #39343a;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* 왼쪽 검색 영역 */
        .sidebar {
            width: 390px;
            min-width: 320px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            background: #fffafb;
            border-right: 1px solid #eadde2;
            overflow: hidden;
        }

        h1 {
            margin: 0 0 8px;
            color: #b65c7d;
            font-size: 23px;
            line-height: 1.4;
        }

        .subtitle {
            margin: 0 0 20px;
            color: #888;
            font-size: 12px;
            line-height: 1.6;
        }

        /* 업체 종류 탭 */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
        }

        .tab-button {
            flex: 1;
            padding: 12px 5px;
            border: 1px solid #e4ccd6;
            border-radius: 8px;
            background: white;
            color: #775866;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .tab-button.active {
            background: #b65c7d;
            border-color: #b65c7d;
            color: white;
        }

        /* 지역 검색창 */
        .search-label {
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: bold;
        }

        .search-box {
            display: flex;
            gap: 7px;
        }

        #searchInput {
            flex: 1;
            width: 0;
            min-width: 0;
            padding: 12px 10px;
            border: 1px solid #ddcbd2;
            border-radius: 7px;
            outline: none;
            font-size: 13px;
        }

        #searchInput:focus {
            border-color: #b65c7d;
        }

        #searchButton {
            padding: 10px 13px;
            border: none;
            border-radius: 7px;
            background: #f4dce5;
            color: #8c4560;
            font-weight: bold;
            cursor: pointer;
        }

        #searchButton:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #status {
            margin: 15px 0 10px;
            color: #777;
            font-size: 12px;
            line-height: 1.7;
        }

        /* 검색 결과 목록 */
        #resultList {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
        }

        .result-item {
            padding: 13px;
            margin-bottom: 9px;
            border: 1px solid #eee0e5;
            border-radius: 9px;
            background: white;
            cursor: pointer;
        }

        .result-item:hover {
            background: #fff0f5;
            border-color: #d7a0b5;
        }

        .place-name {
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
        }

        .place-type {
            display: inline-block;
            margin-bottom: 7px;
            padding: 3px 7px;
            border-radius: 4px;
            background: #f7e7ed;
            color: #9d4e6b;
            font-size: 11px;
        }

        .place-address {
            color: #777;
            font-size: 12px;
            line-height: 1.6;
        }

        .place-phone {
            margin-top: 6px;
            color: #777;
            font-size: 12px;
        }

        .website-link {
            display: inline-block;
            margin-top: 9px;
            color: #a14d6d;
            font-size: 12px;
            text-decoration: underline;
        }

        .empty-message {
            padding: 20px 5px;
            color: #888;
            font-size: 13px;
            line-height: 1.9;
        }

        /* 오른쪽 지도 */
        #map {
            flex: 1;
            min-width: 0;
            height: 100%;
            background: #f2f2f2;
        }

        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                min-width: 0;
                height: 48%;
                padding: 13px;
            }

            h1 {
                font-size: 20px;
            }

            #map {
                width: 100%;
                height: 52%;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- 왼쪽: 제목, 탭, 지역 검색, 결과 목록 -->
        <aside class="sidebar">
            <h1>내 결혼 상대 결정하기💍</h1>

            <p class="subtitle">
                원하는 지역의 결혼정보 업체를 찾아보세요.
            </p>

            <div class="tabs">
                <button
                    type="button"
                    id="generalTab"
                    class="tab-button active"
                    aria-pressed="true"
                >
                    결혼정보회사
                </button>

                <button
                    type="button"
                    id="remarriageTab"
                    class="tab-button"
                    aria-pressed="false"
                >
                    재혼 전문 업체
                </button>
            </div>

            <label class="search-label" for="searchInput">
                검색할 지역
            </label>

            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="지역별로 알아보기"
                    autocomplete="off"
                >

                <button type="button" id="searchButton">
                    검색
                </button>
            </div>

            <div id="status" aria-live="polite">
                지도를 불러오는 중입니다.
            </div>

            <div id="resultList"></div>
        </aside>

        <!-- 오른쪽: 카카오맵 -->
        <div id="map"></div>

    </div>

    <script>
        // 지도와 검색 기능에 필요한 변수
        let map;
        let places;
        let infoWindow;
        let markers = [];
        let currentPosition = null;
        let currentType = "general";
        let searchVersion = 0;
        let isReady = false;

        // 지도 확대 레벨
        const mapLevel = 5;

        // 기본 지도 위치: 서울시청
        const defaultLatitude = 37.5665;
        const defaultLongitude = 126.9780;

        // 현재 위치 주변 검색 반경: 20km
        const nearbyRadius = 20000;

        // 페이지 요소 가져오기
        const generalTab = document.getElementById("generalTab");
        const remarriageTab = document.getElementById("remarriageTab");
        const searchInput = document.getElementById("searchInput");
        const searchButton = document.getElementById("searchButton");
        const resultList = document.getElementById("resultList");
        const status = document.getElementById("status");

        // 탭마다 여러 검색어 사용
        const searchKeywords = {
            general: [
                "결혼정보회사",
                "결혼정보사",
                "결혼정보업체"
            ],
            remarriage: [
                "재혼전문업체",
                "재혼 결혼정보회사",
                "재혼 전문 결혼정보",
                "돌싱 결혼정보회사"
            ]
        };

        // 지역 이름을 표준 행정구역 명칭으로 변환
        const regionAliases = {
            "서울": "서울특별시",
            "경기": "경기도",
            "인천": "인천광역시",
            "부산": "부산광역시",
            "대구": "대구광역시",
            "대전": "대전광역시",
            "광주": "광주광역시",
            "울산": "울산광역시",
            "세종": "세종특별자치시",
            "제주": "제주특별자치도",
            "강원": "강원특별자치도",
            "충북": "충청북도",
            "충남": "충청남도",
            "전북": "전북특별자치도",
            "전남": "전라남도",
            "경북": "경상북도",
            "경남": "경상남도"
        };

        // 재혼 관련 여부를 추정할 때 사용하는 표현
        const remarriageTerms = [
            "재혼",
            "재혼전문",
            "재혼 전문",
            "돌싱",
            "두번째결혼",
            "두 번째 결혼"
        ];

        // 일반 탭에서 재혼 관련 결과를 제외할 때 사용하는 표현
        const generalExcludeTerms = [
            "재혼전문",
            "재혼 전문",
            "재혼전문업체",
            "돌싱전문",
            "돌싱 전문"
        ];

        // SDK가 준비된 후 지도 초기화
        window.addEventListener("load", function () {
            if (!window.kakao || !window.kakao.maps) {
                status.textContent =
                    "카카오맵 SDK를 불러오지 못했습니다. API 키와 웹 도메인 설정을 확인해 주세요.";
                return;
            }

            kakao.maps.load(function () {
                initializeMap();
            });
        });

        // 지도 초기화
        function initializeMap() {
            const defaultPosition = new kakao.maps.LatLng(
                defaultLatitude,
                defaultLongitude
            );

            map = new kakao.maps.Map(
                document.getElementById("map"),
                {
                    center: defaultPosition,
                    level: mapLevel
                }
            );

            places = new kakao.maps.services.Places();

            infoWindow = new kakao.maps.InfoWindow({
                zIndex: 3
            });

            // 탭 이벤트 연결
            generalTab.addEventListener("click", function () {
                changeTab("general");
            });

            remarriageTab.addEventListener("click", function () {
                changeTab("remarriage");
            });

            // 검색 이벤트 연결
            searchButton.addEventListener("click", searchBusinesses);

            searchInput.addEventListener("keydown", function (event) {
                if (event.key === "Enter") {
                    searchBusinesses();
                }
            });

            // 현재 위치 확인
            getCurrentLocation();
        }

        // 현재 위치 가져오기
        function getCurrentLocation() {
            if (!navigator.geolocation) {
                finishLocationSetup(false);
                return;
            }

            status.textContent = "현재 위치를 확인하고 있습니다.";

            navigator.geolocation.getCurrentPosition(
                function (position) {
                    currentPosition = {
                        latitude: position.coords.latitude,
                        longitude: position.coords.longitude
                    };

                    finishLocationSetup(true);
                },

                function () {
                    finishLocationSetup(false);
                },

                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 60000
                }
            );
        }

        // 초기 위치 설정이 끝난 후 검색 준비
        function finishLocationSetup(hasLocation) {
            if (hasLocation && currentPosition) {
                map.setCenter(
                    new kakao.maps.LatLng(
                        currentPosition.latitude,
                        currentPosition.longitude
                    )
                );

                status.textContent =
                    "현재 위치를 확인했습니다. 주변 업체를 검색합니다.";
            } else {
                currentPosition = null;

                map.setCenter(
                    new kakao.maps.LatLng(
                        defaultLatitude,
                        defaultLongitude
                    )
                );

                status.textContent =
                    "현재 위치를 사용할 수 없습니다. 지역을 입력해 검색해 주세요.";
            }

            isReady = true;
            searchBusinesses();
        }

        // 탭 변경
        function changeTab(type) {
            currentType = type;

            generalTab.classList.toggle(
                "active",
                type === "general"
            );

            remarriageTab.classList.toggle(
                "active",
                type === "remarriage"
            );

            generalTab.setAttribute(
                "aria-pressed",
                String(type === "general")
            );

            remarriageTab.setAttribute(
                "aria-pressed",
                String(type === "remarriage")
            );

            clearResults();

            if (isReady) {
                searchBusinesses();
            }
        }

        // 기존 마커와 검색 목록 제거
        function clearResults() {
            // 이전 요청 결과가 뒤늦게 도착해도 무시하도록 설정
            searchVersion++;

            markers.forEach(function (marker) {
                marker.setMap(null);
            });

            markers = [];
            resultList.innerHTML = "";

            if (infoWindow) {
                infoWindow.close();
            }
        }

        // 지역 이름의 공백과 축약형 정리
        function normalizeRegion(region) {
            return region
                .trim()
                .replace(/\s+/g, " ")
                .split(" ")
                .map(function (word, index) {
                    if (index === 0 && regionAliases[word]) {
                        return regionAliases[word];
                    }

                    return word;
                });
        }

        // 주소 비교를 위해 공백과 일부 행정구역 축약형 정리
        function normalizeAddress(address) {
            return address
                .replace(/\s+/g, "")
                .replace(/서울특별시|서울시/g, "서울")
                .replace(/경기도/g, "경기")
                .replace(/인천광역시|인천시/g, "인천")
                .replace(/부산광역시|부산시/g, "부산")
                .replace(/대구광역시|대구시/g, "대구")
                .replace(/대전광역시|대전시/g, "대전")
                .replace(/광주광역시|광주시/g, "광주")
                .replace(/울산광역시|울산시/g, "울산")
                .replace(/충청북도/g, "충북")
                .replace(/충청남도/g, "충남")
                .replace(/전북특별자치도|전라북도/g, "전북")
                .replace(/전라남도/g, "전남")
                .replace(/경상북도/g, "경북")
                .replace(/경상남도/g, "경남")
                .replace(/강원특별자치도|강원도/g, "강원")
                .replace(/제주특별자치도/g, "제주")
                .replace(/세종특별자치시/g, "세종");
        }

        // 입력한 지역이 실제 업체 주소에 포함되는지 확인
        function matchesRegion(place, regionWords) {
            if (regionWords.length === 0) {
                return true;
            }

            const address = normalizeAddress(
                (place.road_address_name || "") + " " +
                (place.address_name || "")
            );

            return regionWords.every(function (word) {
                return address.includes(normalizeAddress(word));
            });
        }

        // 검색 결과가 어느 업체 유형에 더 가까운지 판단
        function classifyPlace(place) {
            const name = (place.place_name || "").toLowerCase();
            const category = (place.category_name || "").toLowerCase();
            const text = name + " " + category;

            const hasRemarriageTerm = remarriageTerms.some(
                function (term) {
                    return text.includes(term.toLowerCase());
                }
            );

            const hasGeneralExcludeTerm = generalExcludeTerms.some(
                function (term) {
                    return text.includes(term.toLowerCase());
                }
            );

            // 이름이나 카테고리에 재혼 관련 표현이 있으면 재혼 관련으로 판단
            if (hasRemarriageTerm) {
                return "remarriage";
            }

            // 일반 탭에서 명확한 재혼 전문 표현은 제외
            if (hasGeneralExcludeTerm) {
                return "remarriage";
            }

            // 재혼 탭에서는 명시적 재혼 관련 표현이 없는 업체를 제외
            if (currentType === "remarriage") {
                return "unknown";
            }

            // 일반 결혼정보 검색 결과는 일반 탭에 표시
            return "general";
        }

        // 한 검색어의 결과를 페이지별로 가져오기
        function searchKeywordPages(keyword, region, maxPages) {
            return new Promise(function (resolve) {
                const collected = [];
                let page = 1;

                function requestPage() {
                    const options = {
                        size: 15,
                        page: page
                    };

                    // 지역이 입력되면 검색어에도 지역을 포함
                    const query = region
                        ? region + " " + keyword
                        : keyword;

                    // 현재 위치 검색 시 주변 좌표와 반경 설정
                    if (!region && currentPosition) {
                        options.location = new kakao.maps.LatLng(
                            currentPosition.latitude,
                            currentPosition.longitude
                        );

                        options.radius = nearbyRadius;
                        options.sort = kakao.maps.services.SortBy.DISTANCE;
                    }

                    places.keywordSearch(
                        query,
                        function (data, result, pagination) {
                            if (
                                result === kakao.maps.services.Status.OK
                            ) {
                                collected.push.apply(collected, data);

                                // 결과가 더 있으면 다음 페이지 요청
                                if (
                                    pagination &&
                                    !pagination.last &&
                                    page < maxPages
                                ) {
                                    page++;
                                    requestPage();
                                } else {
                                    resolve(collected);
                                }
                            } else {
                                resolve(collected);
                            }
                        },
                        options
                    );
                }

                requestPage();
            });
        }

        // 검색어 여러 개의 결과를 합쳐 검색
        async function searchBusinesses() {
            if (!isReady || !places || !map) {
                status.textContent = "지도를 준비하고 있습니다.";
                return;
            }

            // 새 검색 요청 번호 생성
            const requestVersion = ++searchVersion;

            // 이전 결과 제거
            markers.forEach(function (marker) {
                marker.setMap(null);
            });

            markers = [];
            resultList.innerHTML = "";
            infoWindow.close();

            const region = searchInput.value.trim();
            const regionWords = region
                ? normalizeRegion(region)
                : [];

            const keywords = searchKeywords[currentType];
            const uniquePlaces = new Map();

            searchButton.disabled = true;
            status.textContent = region
                ? "'" + region + "' 지역의 업체를 검색하고 있습니다."
                : "주변 업체를 검색하고 있습니다.";

            try {
                // 각 검색어로 최대 3페이지까지 검색
                for (const keyword of keywords) {
                    if (requestVersion !== searchVersion) {
                        return;
                    }

                    const results = await searchKeywordPages(
                        keyword,
                        region,
                        3
                    );

                    if (requestVersion !== searchVersion) {
                        return;
                    }

                    results.forEach(function (place) {
                        // 장소 ID를 기준으로 중복 제거
                        const id = place.id ||
                            (
                                place.place_name + "|" +
                                place.address_name
                            );

                        if (!uniquePlaces.has(id)) {
                            uniquePlaces.set(id, place);
                        }
                    });
                }

                if (requestVersion !== searchVersion) {
                    return;
                }

                let results = Array.from(uniquePlaces.values());

                // 실제 주소 기준 지역 필터링
                if (region) {
                    results = results.filter(function (place) {
                        return matchesRegion(place, regionWords);
                    });
                } else if (currentPosition) {
                    // 현재 위치 주변 검색 결과만 유지
                    results = results.filter(function (place) {
                        const distance = Number(place.distance);

                        // 거리 정보가 없으면 좌표로 거리 계산
                        if (Number.isFinite(distance)) {
                            return distance <= nearbyRadius;
                        }

                        return calculateDistance(
                            currentPosition.latitude,
                            currentPosition.longitude,
                            Number(place.y),
                            Number(place.x)
                        ) <= nearbyRadius;
                    });
                }

                // 일반 업체와 재혼 전문 업체 분리
                results = results.filter(function (place) {
                    const classification = classifyPlace(place);

                    if (currentType === "general") {
                        return classification === "general";
                    }

                    return classification === "remarriage";
                });

                // 주소와 좌표가 없는 결과 제외
                results = results.filter(function (place) {
                    return (
                        place.x &&
                        place.y &&
                        (
                            place.road_address_name ||
                            place.address_name
                        )
                    );
                });

                // 현재 위치 검색일 때 가까운 순서로 정렬
                if (!region && currentPosition) {
                    results.sort(function (a, b) {
                        return calculateDistance(
                            currentPosition.latitude,
                            currentPosition.longitude,
                            Number(a.y),
                            Number(a.x)
                        ) - calculateDistance(
                            currentPosition.latitude,
                            currentPosition.longitude,
                            Number(b.y),
                            Number(b.x)
                        );
                    });
                }

                if (results.length === 0) {
                    status.textContent =
                        "조건에 맞는 업체를 찾지 못했습니다.";

                    resultList.innerHTML =
                        '<div class="empty-message">' +
                        '검색 결과가 없습니다.<br><br>' +
                        '다른 지역명을 입력하거나 검색어를 바꿔 보세요.<br>' +
                        '재혼 탭은 업체명 또는 업종에 재혼 관련 표현이 확인된 결과만 표시합니다.' +
                        '</div>';

                    return;
                }

                // 검색 결과 표시
                displayResults(results);

                status.textContent =
                    (currentType === "general"
                        ? "일반 결혼정보회사"
                        : "재혼 관련 업체") +
                    " · " + results.length + "개";

                // 결과 전체가 지도에 보이도록 조정
                const bounds = new kakao.maps.LatLngBounds();

                results.forEach(function (place) {
                    bounds.extend(
                        new kakao.maps.LatLng(
                            Number(place.y),
                            Number(place.x)
                        )
                    );
                });

                map.setBounds(bounds);

            } catch (error) {
                if (requestVersion === searchVersion) {
                    status.textContent =
                        "검색 중 오류가 발생했습니다. API 설정과 네트워크를 확인해 주세요.";
                }
            } finally {
                if (requestVersion === searchVersion) {
                    searchButton.disabled = false;
                }
            }
        }

        // 두 좌표 사이의 거리 계산
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const earthRadius = 6371000;
            const toRadians = Math.PI / 180;

            const latitudeDifference = (lat2 - lat1) * toRadians;
            const longitudeDifference = (lon2 - lon1) * toRadians;

            const a =
                Math.sin(latitudeDifference / 2) ** 2 +
                Math.cos(lat1 * toRadians) *
                Math.cos(lat2 * toRadians) *
                Math.sin(longitudeDifference / 2) ** 2;

            return 2 * earthRadius *
                Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        // 검색 결과를 목록과 지도에 표시
        function displayResults(data) {
            resultList.innerHTML = "";

            data.forEach(function (place) {
                const position = new kakao.maps.LatLng(
                    Number(place.y),
                    Number(place.x)
                );

                // 장소마다 마커 생성
                const marker = new kakao.maps.Marker({
                    map: map,
                    position: position,
                    title: place.place_name
                });

                markers.push(marker);

                // 마커 클릭 시 상세 팝업
                kakao.maps.event.addListener(
                    marker,
                    "click",
                    function () {
                        showPlaceInfo(place, marker);
                    }
                );

                // 결과 목록 항목 생성
                const item = document.createElement("div");
                item.className = "result-item";

                const name = document.createElement("div");
                name.className = "place-name";
                name.textContent = place.place_name;

                const type = document.createElement("div");
                type.className = "place-type";
                type.textContent = currentType === "general"
                    ? "일반 결혼정보회사 검색 결과"
                    : "재혼 관련 검색 결과";

                const address = document.createElement("div");
                address.className = "place-address";
                address.textContent =
                    place.road_address_name ||
                    place.address_name ||
                    "주소 정보 없음";

                item.appendChild(name);
                item.appendChild(type);
                item.appendChild(address);

                if (place.phone) {
                    const phone = document.createElement("div");
                    phone.className = "place-phone";
                    phone.textContent = "전화: " + place.phone;
                    item.appendChild(phone);
                }

                // 카카오맵 상세 페이지 링크
                if (place.place_url) {
                    const link = document.createElement("a");
                    link.className = "website-link";
                    link.href = place.place_url;
                    link.target = "_blank";
                    link.rel = "noopener noreferrer";
                    link.textContent = "카카오맵에서 상세 정보 보기";

                    // 링크 클릭이 목록 선택 이벤트로 이어지지 않도록 처리
                    link.addEventListener("click", function (event) {
                        event.stopPropagation();
                    });

                    item.appendChild(link);
                }

                // 목록 클릭 시 해당 마커로 이동
                item.addEventListener("click", function () {
                    map.setCenter(position);
                    map.setLevel(mapLevel);
                    showPlaceInfo(place, marker);
                });

                resultList.appendChild(item);
            });
        }

        // 마커 클릭 시 업체 이름과 주소 표시
        function showPlaceInfo(place, marker) {
            const address =
                place.road_address_name ||
                place.address_name ||
                "주소 정보 없음";

            const content =
                '<div style="padding:12px;min-width:190px;' +
                'max-width:270px;line-height:1.7;">' +
                '<strong style="font-size:14px;">' +
                escapeHTML(place.place_name) +
                '</strong><br>' +
                '<span style="font-size:12px;color:#666;">' +
                escapeHTML(address) +
                '</span>' +
                (place.phone
                    ? '<br><span style="font-size:12px;color:#666;">전화: ' +
                      escapeHTML(place.phone) +
                      '</span>'
                    : '') +
                (place.place_url
                    ? '<br><a href="' + escapeHTML(place.place_url) +
                      '" target="_blank" rel="noopener noreferrer" ' +
                      'style="font-size:12px;color:#a14d6d;">' +
                      '상세 정보 보기</a>'
                    : '') +
                '</div>';

            infoWindow.setContent(content);
            infoWindow.open(map, marker);
        }

        // HTML에 표시하는 문자열의 특수문자 처리
        function escapeHTML(value) {
            return String(value).replace(/[&<>"']/g, function (character) {
                const characters = {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#39;"
                };

                return characters[character];
            });
        }
    </script>
</body>
</html>
